<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" type="image/png" href="favicon.ico">
    <title>Biblioteca 2.0</title>

    <!-- Google Fonts: JetBrains Mono for tech feel, Inter for clean Fedora look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@100;400;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fRed: '#c20000',
                        fBlack: '#000000',
                        fGray: '#888888',
                        fLightGray: '#cccccc'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Anime.js for complex timeline and morphing animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <!-- Three.js ES Modules for advanced Mars rendering -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            color: #ffffff;
        }

        /* 3D Canvas positioning */
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* HUD Corner Brackets - hidden on mobile by default, shown on larger screens */
        .hud-bracket {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #c20000;
            z-index: 10;
            opacity: 0;
        }
        
        /* Desktop bracket visibility */
        @media (min-width: 768px) {
            .bracket-tl { top: 2rem; left: 2rem; border-top: 2px solid; border-left: 2px solid; }
            .bracket-tr { top: 2rem; right: 2rem; border-top: 2px solid; border-right: 2px solid; }
            .bracket-bl { bottom: 2rem; left: 2rem; border-bottom: 2px solid; border-left: 2px solid; }
            .bracket-br { bottom: 2rem; right: 2rem; border-bottom: 2px solid; border-right: 2px solid; }
        }
        
        /* On mobile, brackets are hidden completely */
        @media (max-width: 767px) {
            .hud-bracket {
                display: none;
            }
        }

        /* FIX: Hide title element completely before scramble to prevent flash */
        #scramble-title-main {
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.2s ease;
        }
        
        /* When scramble animation begins, make it visible via JS adding a class */
        #scramble-title-main.reveal-title {
            visibility: visible;
            opacity: 1;
        }

        ::selection {
            background-color: #c20000;
            color: #ffffff;
        }

        #cta-button {
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.3s ease;
        }
        
        #cta-button:hover {
            box-shadow: 0 0 20px rgba(194, 0, 0, 0.6);
            transform: scale(1.02);
        }
        
        /* Mobile touch optimization for button */
        @media (max-width: 640px) {
            #cta-button {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                padding-top: 0.75rem;
                padding-bottom: 0.75rem;
                font-size: 0.7rem;
                letter-spacing: 0.1em;
            }
            #cta-button i {
                width: 1rem;
                height: 1rem;
            }
        }

        .bg-word {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            color: #333333;
            font-size: 0.8rem;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
        }
        
        /* Mobile font size adjustments for background words */
        @media (max-width: 640px) {
            .bg-word {
                font-size: 0.5rem;
            }
        }

        /* Overlay for fade-out redirect effect */
        #fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        /* Mobile-specific adjustments for main content to ensure perfect fit */
        @media (max-width: 768px) {
            .main-content {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            h1 {
                font-size: 2rem !important;
                margin-bottom: 0.5rem !important;
            }
            #ui-desc {
                font-size: 0.7rem !important;
                margin-bottom: 1.5rem !important;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }
            .p-8 {
                padding: 1rem !important;
            }
            .gap-3 {
                gap: 0.5rem;
            }
            .w-10.h-10 {
                width: 2rem;
                height: 2rem;
            }
            footer .flex {
                gap: 0.5rem;
            }
        }
        
        /* Medium screens adjustment */
        @media (min-width: 768px) and (max-width: 1024px) {
            h1 {
                font-size: 3.5rem !important;
            }
            #ui-desc {
                font-size: 0.6rem !important;
            }
        }
        
        /* Hide header/footer elements that clutter mobile - keep only essentials */
        @media (max-width: 640px) {
            #ui-header .text-right {
                display: none !important;
            }
            #ui-footer .flex.gap-4 {
                gap: 0.75rem;
            }
            #ui-footer a i {
                width: 1rem;
                height: 1rem;
            }
            .target-word-label {
                font-size: 0.65rem;
            }
            #coordinates {
                font-size: 0.6rem;
            }
            .font-mono.text-xs {
                font-size: 0.6rem;
            }
            #ui-badge {
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                margin-bottom: 0.75rem;
            }
            #ui-badge i {
                width: 0.75rem;
                height: 0.75rem;
            }
            #ui-badge span {
                font-size: 0.6rem;
            }
        }
    </style>
</head>
<body class="antialiased selection:bg-fRed selection:text-white">

    <div id="webgl-container"></div>

    <div id="bg-words-container" class="absolute inset-0 z-0 overflow-hidden pointer-events-none"></div>

    <div class="hud-bracket bracket-tr"></div>
    <div class="hud-bracket bracket-bl"></div>

    <div class="relative z-20 flex flex-col justify-between w-full h-full p-4 md:p-8 lg:p-12 pointer-events-none main-container">
        
        <!-- HEADER - adapted for mobile: hidden right section on small screens -->
        <header class="flex justify-between items-start w-full pointer-events-auto opacity-0" id="ui-header">
            <div class="flex items-center gap-2 md:gap-3">
                <div class="relative flex items-center justify-center w-8 h-8 md:w-10 md:h-10 border border-fRed rounded-full bg-fBlack overflow-hidden group hover:border-white transition-colors cursor-pointer">
                    <i data-lucide="mic" class="w-4 h-4 md:w-5 md:h-5 text-fRed group-hover:text-white transition-colors"></i>
                </div>
                <div class="flex flex-col">

    <script type="module">
        import * as THREE from 'three';
        
        // --- Setup Scene, Camera, Renderer for MARS ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0012);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 16);
        
        const renderer = new THREE.WebGLRenderer({ alpha: false, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        
        // --- Lighting for Mars (warm reddish tones) ---
        const ambientLight = new THREE.AmbientLight(0x331100);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffaa77, 1.4);
        mainLight.position.set(5, 5, 7);
        scene.add(mainLight);
        const fillLight = new THREE.PointLight(0xaa6644, 0.4);
        fillLight.position.set(-3, 2, 4);
        scene.add(fillLight);
        const backLight = new THREE.PointLight(0xff8866, 0.25);
        backLight.position.set(0, 2, -6);
        scene.add(backLight);
        
        // --- Mars Textures ---
        const textureLoader = new THREE.TextureLoader();
        const marsMap = textureLoader.load('https://threejs.org/examples/textures/planets/mars.jpg');
        const marsNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        
        const marsGeometry = new THREE.SphereGeometry(5, 128, 128);
        const marsMaterial = new THREE.MeshPhongMaterial({
            map: marsMap,
            color: 0xcc8866,
            emissive: 0x331100,
            emissiveIntensity: 0.15,
            shininess: 30,
            normalMap: marsNormalMap,
            normalScale: new THREE.Vector2(0.6, 0.6)
        });
        const mars = new THREE.Mesh(marsGeometry, marsMaterial);
        scene.add(mars);
        
        // --- Martian atmosphere glow ---
        const atmosphereGeometry = new THREE.SphereGeometry(5.08, 128, 128);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0xcc6644,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);
        
        // --- Dust particle ring ---
        const dustCount = 800;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            const radius = 5.5 + Math.random() * 0.8;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            dustPositions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            dustPositions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            dustPositions[i*3+2] = radius * Math.cos(phi);
        }
        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMaterial = new THREE.PointsMaterial({
            color: 0xcc8866,
            size: 0.03,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending
        });
        const dustParticles = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dustParticles);
        
        // --- Starfield (background particles) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 200;
            starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // --- Additional distant stars ---
        const starGeometry2 = new THREE.BufferGeometry();
        const starCount2 = 1200;
        const starPositions2 = new Float32Array(starCount2 * 3);
        for (let i = 0; i < starCount2; i++) {
            starPositions2[i*3] = (Math.random() - 0.5) * 600;
            starPositions2[i*3+1] = (Math.random() - 0.5) * 300;
            starPositions2[i*3+2] = (Math.random() - 0.5) * 150 - 80;
        }
        starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3));
        const starMaterial2 = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.08, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending });
        const stars2 = new THREE.Points(starGeometry2, starMaterial2);
        scene.add(stars2);
        
        // --- Mouse Interaction: Mars rotates to follow cursor ---
        let mouseX = 0, mouseY = 0;
        let targetRotY = 0, targetRotX = 0;
        let currentRotY = 0, currentRotX = 0;
        
        window.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = (event.clientY / window.innerHeight) * 2 - 1;
            targetRotY = mouseX * 1.5;
            targetRotX = mouseY * 0.6;
            
            const coordElem = document.getElementById('coordinates');
            if (coordElem) {
                coordElem.innerText = `LAT: ${((mouseY * 90).toFixed(1))}° | LON: ${((mouseX * 180).toFixed(1))}° | PLANET: MARS`;
            }
        });
        
        // --- Animation variables for warp effect ---
        let starSpeed = 0.006;
        
        const ctaBtn = document.getElementById('cta-button');
        ctaBtn.addEventListener('mouseenter', () => {
            starSpeed = 0.15;
            anime({
                targets: { val: marsMaterial.emissiveIntensity },
                val: 0.35,
                duration: 400,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; },
                easing: 'easeOutQuad'
            });
            anime({
                targets: atmosphereMaterial,
                opacity: 0.18,
                duration: 400
            });
        });
        
        ctaBtn.addEventListener('mouseleave', () => {
            starSpeed = 0.006;
            anime({
                targets: { val: marsMaterial.emissiveIntensity },
                val: 0.15,
                duration: 700,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; },
                easing: 'easeOutQuad'
            });
            anime({
                targets: atmosphereMaterial,
                opacity: 0.08,
                duration: 700
            });
        });
        
        // Redirect with fade effect
        ctaBtn.addEventListener('click', () => {
            const clickSound = document.getElementById('click-sfx');
    clickSound.currentTime = 0;
    clickSound.play();
    
            const overlay = document.getElementById('fade-overlay');
            if (overlay) {
                overlay.style.pointerEvents = 'auto';
                overlay.style.opacity = '1';
            }
            
            anime({
                targets: camera.position,
                z: 6,
                duration: 600,
                easing: 'easeInQuad'
            });
            
            anime({
                targets: { light: mainLight.intensity, ambient: ambientLight.intensity, fill: fillLight.intensity, back: backLight.intensity },
                light: 0,
                ambient: 0,
                fill: 0,
                back: 0,
                duration: 700,
                easing: 'easeOutQuad',
                update: (anim) => {
                    const val = anim.animations[0].currentValue;
                    mainLight.intensity = val;
                    ambientLight.intensity = val * 0.8;
                    fillLight.intensity = val * 0.3;
                    backLight.intensity = val * 0.2;
                },
                complete: () => {
                    setTimeout(() => {
                        window.location.href = './home.html';
                    }, 200);
                }
            });
            
            anime({
                targets: { emiss: marsMaterial.emissiveIntensity },
                emiss: 0,
                duration: 700,
                update: (anim) => { marsMaterial.emissiveIntensity = anim.animations[0].currentValue; }
            });
            
            starSpeed = 0;
        });
        
        // Starfield movement (warp effect)
        function animateStars() {
            const positions = stars.geometry.attributes.position.array;
            for (let i = 0; i < starCount; i++) {
                positions[i*3+2] += starSpeed;
                if (positions[i*3+2] > 50) positions[i*3+2] = -50;
            }
            stars.geometry.attributes.position.needsUpdate = true;
            
            const positions2 = stars2.geometry.attributes.position.array;
            for (let i = 0; i < starCount2; i++) {
                positions2[i*3+2] += starSpeed * 0.7;
                if (positions2[i*3+2] > 70) positions2[i*3+2] = -60;
            }
            stars2.geometry.attributes.position.needsUpdate = true;
            
            requestAnimationFrame(animateStars);
        }
        animateStars();
        
        // --- Main Render Loop ---
        let time = 0;
        
        function animate3D() {
            requestAnimationFrame(animate3D);
            time += 0.016;
            
            currentRotY += (targetRotY - currentRotY) * 0.08;
            currentRotX += (targetRotX - currentRotX) * 0.08;
            
            mars.rotation.y = currentRotY;
            mars.rotation.x = currentRotX * 0.4;
            atmosphere.rotation.y = mars.rotation.y;
            atmosphere.rotation.x = mars.rotation.x;
            
            dustParticles.rotation.y += 0.001;
            dustParticles.rotation.x += 0.0005;
            
            const pulse = 0.08 + Math.sin(time * 0.8) * 0.02;
            atmosphereMaterial.opacity = pulse;
            
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            stars2.rotation.y -= 0.00015;
            
            renderer.render(scene, camera);
        }
        
        animate3D();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        setTimeout(() => {
            targetRotY = 0.6;
            targetRotX = 0.1;
        }, 500);
    </script>
    
    <script type="module">
        // UI Entrance Animations & Text Scramble - NO FLASH FIXED
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            class TextScramble {
                constructor(el) {
                    this.el = el;
                    this.chars = '!<>-_\\/[]{}—=+*^?#_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
                    this.update = this.update.bind(this);
                }
                setText(newText) {
                    const oldText = this.el.innerText;
                    const length = Math.max(oldText.length, newText.length);
                    const promise = new Promise((resolve) => this.resolve = resolve);
                    this.queue = [];
                    for (let i = 0; i < length; i++) {
                        const from = oldText[i] || '';
                        const to = newText[i] || '';
                        const start = Math.floor(Math.random() * 40);
                        const end = start + Math.floor(Math.random() * 40);
                        this.queue.push({ from, to, start, end, char: '' });
                    }
                    cancelAnimationFrame(this.frameRequest);
                    this.frame = 0;
                    this.update();
                    return promise;
                }
                update() {
                    let output = '';
                    let complete = 0;
                    for (let i = 0, n = this.queue.length; i < n; i++) {
                        let { from, to, start, end, char } = this.queue[i];
                        if (this.frame >= end) {
                            complete++;
                            output += to;
                        } else if (this.frame >= start) {
                            if (!char || Math.random() < 0.28) {
                                char = this.randomChar();
                                this.queue[i].char = char;
                            }
                            output += `<span class="text-fRed">${char}</span>`;
                        } else {
                            output += from;
                        }
                    }
                    this.el.innerHTML = output;
                    if (complete === this.queue.length) {
                        this.resolve();
                    } else {
                        this.frameRequest = requestAnimationFrame(this.update);
                        this.frame++;
                    }
                }
                randomChar() { return this.chars[Math.floor(Math.random() * this.chars.length)]; }
            }
            
            const titleMainSpan = document.getElementById('scramble-title-main');
            const badgeSpan = document.getElementById('scramble-badge');
            const originalTitle = "Language Library";
            const originalBadge = "Open Library protocol";
            
            // Clear any residual text and ensure it's empty before animation
            if (titleMainSpan) {
                // Keep the underline element reference
                const underline = titleMainSpan.querySelector('#title-line');
                titleMainSpan.innerHTML = '';
                titleMainSpan.appendChild(document.createTextNode(''));
                if (underline) titleMainSpan.appendChild(underline);
            }
            if (badgeSpan) badgeSpan.innerText = "";
            
            const titleScrambler = new TextScramble(titleMainSpan);
            const badgeScrambler = new TextScramble(badgeSpan);
            
            const tl = anime.timeline({ easing: 'easeOutExpo' });
            tl.add({ targets: '.hud-bracket', opacity: [0, 1], scale: [1.5, 1], duration: 1000, delay: anime.stagger(200) })
              .add({ targets: ['#ui-header', '#ui-footer'], opacity: [0, 1], translateY: [-20, 0], duration: 800 }, '-=600')
              .add({ targets: '#ui-badge', opacity: [0, 1], duration: 500, begin: () => badgeScrambler.setText(originalBadge) }, '-=400')
              .add({ 
                  duration: 1000, 
                  begin: () => {
                      // Reveal the title container (remove CSS visibility/opacity block)
                      titleMainSpan.classList.add('reveal-title');
                      titleScrambler.setText(originalTitle).then(() => {
                          const underlineLine = document.getElementById('title-line');
                          if (underlineLine) {
                              anime({
                                  targets: underlineLine,
                                  scaleX: [0, 1],
                                  duration: 800,
                                  easing: 'easeOutQuint'
                              });
                          }
                      });
                  } 
              }, '-=200')
              .add({ targets: '#ui-desc', opacity: [0, 1], translateY: [20, 0], duration: 800 }, '+=800')
              .add({ targets: '#cta-button', opacity: [0, 1], clipPath: ['polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%, 50% 50%)', 'polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%)'], duration: 1000, easing: 'easeOutElastic(1, .8)' }, '-=400');
            
            // Floating background words
            const wordsList = ["SYNTAX", "PHONETICS", "SEMANTICS", "MORPHOLOGY", "PRAGMATICS", "LEXICON", "FLUENCY", "IDIOM", "VERB", "COGNATE", "MARS", "OLYMPUS", "ARES"];
            const bgContainer = document.getElementById('bg-words-container');
            
            for(let i = 0; i < 18; i++) {
                const wordEl = document.createElement('div');
                wordEl.classList.add('bg-word');
                wordEl.innerText = wordsList[Math.floor(Math.random() * wordsList.length)];
                wordEl.style.left = `${Math.random() * 100}%`;
                wordEl.style.top = `${Math.random() * 100}%`;
                const randomScale = Math.random() * 1.5 + 0.5;
                wordEl.style.transform = `scale(${randomScale})`;
                wordEl.style.opacity = '0';
                bgContainer.appendChild(wordEl);
                
                anime({
                    targets: wordEl,
                    translateX: () => anime.random(-120, 120),
                    translateY: () => anime.random(-120, 120),
                    opacity: [0, Math.random() * 0.12],
                    duration: () => anime.random(12000, 22000),
                    direction: 'alternate',
                    loop: true,
                    easing: 'linear'
                });
            }
        });
    </script>
